<!DOCTYPE html><meta name=viewport content="width=device-width"><title>Document</title>
<style>body { margin: 0; background-color: black; overflow: hidden; touch-action: none; }</style>
<canvas id=c></canvas>
<script>
    x = c.getContext('2d'); W=c.width=innerWidth;H=c.height=innerHeight
    C=Math.cos;S=Math.sin;M=Math.max;I=Math.min;B=Math.abs;Q=Math.random
    G=sc=best=D=sh=lt=px=py=tx=ty=cx=cy=n=nt=0
    A=0;K={};O=[]
    
    Z=v=>M(-3,I(3,v))
    J=(a,b,z)=>[W/2+(a-cx)*H/2/z,H/2+(b-cy)*H/2/z]
    r=(q,z)=>J(C(q*.785)*s, S(q*.785)*s,z)
    E=[];for(i=8;i--;)for(j=i;j--;)(i^j)-1||E.push([i,j])

    N=(f,d,v,y='square',t=A.currentTime,e=f,o=A.createOscillator(),g=A.createGain()) =>{
        o.type=y;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(e,t+d)
        g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(1e-4,t+d)
        o.connect(g);g.connect(A.destination);o.start(t);o.stop(t+d)
    }
    Y=(n,t)=>{
        b=[0,5,3,7][n>>4&3]
        n%4||N(150,.2,.5,'sine',t,40)
        n%8==3&&N(250,.12,.15,'sawtooth',t,60)
        n%2&&N(9e3,.03,.03,'square',t)
        n%2||N(55*2**((b+[0,0,3,0,5,0,7,3][n>>1&7])/12),.2,.2,'sawtooth',t)
        N(440*2**((b+[0,3,7,10,12,10,7,3][n&7])/12),.1,.05,'triangle',t)
        if(n%4==0)for(j=1+I(sc/15|0,3);j--;)O.push([j?(Q()-.5)*6.5:px,j?(Q()-.5)*6.5:py,70])
    }
setInterval(_=>{for(;G==1&&nt<A.currentTime+.1;nt+=3/28)Y(n++,nt)},25)

    go=_=>{G-1&&(A=A||new AudioContext,G=1,sc=n=pc=py=0,O=[], T0=nt=A.currentTime+.1)}
    die=_=>{G=2;sh=2;best=M(best,sc);N(110,1,.5, 'sawtooth',A.currentTime,20)}
    onpointerdown=go
    onpointermove=e=>{tx=Z((e.x/W-.5)*8);ty=Z((e.y/H-.5)*8)}
    onkeydown=e=>{K[e.keyCode]=1;e.keyCode==32&&go()}
    onkeyup=e=>K[e.keyCode]=0

    L=t=>{
        requestAnimationFrame(L)
        d=I((t-lt)/16.7,3)||1;lt=t
        x.globalCompositeOperation='source-over'
        x.fillsStyle='#0004'
        x.fillRect(0,0,W,H)
        x.globalCompositeOperation='lighter'
        sp=G==1?.25+sc*.003:.1
        P=G==1?1-((A.currentTime-T0)*7/3%1):.3
        if(G==1){
            tx=Z(tx+((K[39]|K[68])-(K[37]|K[65]))*.2);
            ty=Z(ty+((K[40]|K[83])-(K[38]|K[87]))*.2);
            px+=(tx-px)*.2
            py+=(ty-py)*.2
            O=O.filter(o=>{
                o[2]-=sp*d
                o[2]<5&o[2]>3&B(o[0]-px)<1.5&B(o[1]-py)<1.5&&die()
                return o[2]>2||(sc++,N(440*2**([0,2,4,7,9][sc%5]/12),.15,.08,'triangle'),0)
            })
        }
        D+=sp*d
        sh*=.9
        
        cx=px/2+(Q()-.5)*sh
        cy=py/2+(Q()-.5)*sh

        x.lineWidth=2+P*2
        for(k=16;k--;){
            z=k*5+5.5-D%5
            s=4+P*.4
            x.strokeStyle=`hsla(${((D/5|0)+k)*15+sc*3},90%,${40+P*25}%,${1-z/85})`
            x.beginPath()
            for(q=9;q--;) x.lineTo(...r(q,z))
            for(q=8;q--;)x.moveTo(...r(q,z)), x.lineTo(...r(q,z+5))
            x.stroke()
        }
        O.map(o=>{
            if(o[2]<1.5)return
            V=[...Array(8)].map((_,k)=>J(o[0]+(k&1)*2-1,o[1]+(k>>1&1)*2-1,o[2]+(k>>2)*2-1))
            x.strokeStyle=`hsla(${o[2]*4+D*5+180},100%,${55+P*20}%,${I(1,2-o[2]/35)})`
            x.beginPath()
            E.map(([i,j])=>(x.moveTo(...V[i]),x.lineTo(...V[j])))
            x.stroke()
        })

        if(G<2){
            x.fillStyle=x.strokeStyle='white'
            w=(tx-px)*.3
            x.beginPath()
            x.lineTo(...J(px,py-.3,5))
            x.lineTo(...J(px-1,py+.5+w,4))
            x.lineTo(...J(px+1,py+.5-w,4))
            x.closePath()
            x.fill()
            x.stroke()
        }


    }

</script>
